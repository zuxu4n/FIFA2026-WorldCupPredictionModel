[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wcpred"
version = "0.1.0"
description = "World Cup match predictor: XGBoost Poisson expected goals -> W/D/L odds"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost>=2.0",
    "scipy",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]
